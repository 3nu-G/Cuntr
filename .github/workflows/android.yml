name: Android Kotlin CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # THIS STEP GENERATES THE MISSING FILES FOR YOU AUTOMATICALLY
    - name: Generate Missing Gradle Files
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper missing. Initializing standard wrapper..."
          gradle wrapper
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
